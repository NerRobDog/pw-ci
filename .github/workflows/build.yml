name: build-client

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # nightly 02:30 UTC

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SRC_REPO: Prime-World-Classic/prime-world-classic
      R1117: pw/branches/r1117
    steps:
      - name: Checkout game sources (sparse, LFS)
        uses: actions/checkout@v4
        with:
          repository: Prime-World-Classic/prime-world-classic
          path: game
          lfs: true
          sparse-checkout: |
            pw/branches/r1117/Src
            pw/branches/r1117/Vendor
            pw/branches/r1117/Tools
            pw/branches/r1117/Data/GameLogic
          sparse-checkout-cone-mode: true

      - name: Cache VC9 toolchain
        id: vc9cache
        uses: actions/cache@v4
        with:
          path: C:\vc9
          key: vc9-wdk71-v4

      - name: Cache ISOs
        if: steps.vc9cache.outputs.cache-hit != 'true'
        id: isocache
        uses: actions/cache@v4
        with:
          path: C:\iso
          key: iso-wdk-express-v1

      - name: Download WDK 7.1 ISO
        if: steps.vc9cache.outputs.cache-hit != 'true' && steps.isocache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\iso | Out-Null
          $ok=$false
          foreach ($i in 1..4) {
            try { Invoke-WebRequest -Uri "https://archive.org/download/grmwdk-en-7600-1/GRMWDK_EN_7600_1.ISO" -OutFile C:\iso\WDK71.iso -TimeoutSec 3000; $ok=$true; break }
            catch { Write-Host "attempt $i failed: $($_.Exception.Message)"; Start-Sleep -Seconds (30*$i) }
          }
          if (-not $ok) { throw "WDK ISO download failed after retries" }
          $ok=$false
          foreach ($i in 1..4) {
            try { Invoke-WebRequest -Uri "https://archive.org/download/vs-2008-express-with-sp-1-esnx-1504732/VS2008ExpressWithSP1ESNx1504732.iso" -OutFile C:\iso\VS2008Express.iso -TimeoutSec 4000; $ok=$true; break }
            catch { Write-Host "attempt $i failed: $($_.Exception.Message)"; Start-Sleep -Seconds (30*$i) }
          }
          if (-not $ok) { throw "Express ISO download failed after retries" }

      - name: Extract VC9 toolchain from WDK ISO (lessmsi)
        if: steps.vc9cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install lessmsi -y --no-progress | Select-Object -Last 1
          $m = Mount-DiskImage -ImagePath C:\iso\WDK71.iso -PassThru
          $d = ($m | Get-Volume).DriveLetter
          Write-Host "=== WDK ISO root:"; Get-ChildItem "$d`:\" | ForEach-Object Name
          Write-Host "=== msi list:"; Get-ChildItem "$d`:\" -Recurse -Filter *.msi -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName) $([math]::Round($_.Length/1MB,1))MB" }
          New-Item -ItemType Directory -Force -Path C:\wdkx | Out-Null
          Get-ChildItem "$d`:\" -Recurse -Filter *.msi -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "vctools|headers|libs|build|kittools|crt" } |
            ForEach-Object {
              Write-Host ">>> lessmsi x $($_.Name)"
              & "C:\ProgramData\chocolatey\bin\lessmsi.exe" x $_.FullName "C:\wdkx\$($_.BaseName)\" | Select-Object -Last 1
            }
          Write-Host "=== cl.exe candidates:"
          Get-ChildItem C:\wdkx -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | ForEach-Object FullName
          Write-Host "=== include dirs:"
          Get-ChildItem C:\wdkx -Recurse -Directory -Include inc,crt,api -ErrorAction SilentlyContinue | Select-Object -First 15 | ForEach-Object FullName
          $cl = Get-ChildItem C:\wdkx -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\x86\\" -and $_.FullName -notmatch "amd64|ia64" } | Select-Object -First 1
          if (-not $cl) { $cl = Get-ChildItem C:\wdkx -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $cl) { throw "no cl.exe in WDK extraction — see listings" }
          # staged layout: C:\vc9\bin (компилятор+вспом.), C:\vc9\inc..., C:\vc9\lib...
          New-Item -ItemType Directory -Force -Path C:\vc9 | Out-Null
          Copy-Item -Recurse -Force (Split-Path (Split-Path $cl.FullName)) C:\vc9\bin
          $incApi = Get-ChildItem C:\wdkx -Recurse -Directory -Filter api | Where-Object { Test-Path (Join-Path $_.FullName "windows.h") } | Select-Object -First 1
          $incCrt = Get-ChildItem C:\wdkx -Recurse -Directory -Filter crt | Where-Object { Test-Path (Join-Path $_.FullName "stdio.h") } | Select-Object -First 1
          if ($incApi) { Copy-Item -Recurse -Force $incApi.FullName C:\vc9\inc_api }
          if ($incCrt) { Copy-Item -Recurse -Force $incCrt.FullName C:\vc9\inc_crt }
          $libDirs = Get-ChildItem C:\wdkx -Recurse -Directory -Filter i386 -ErrorAction SilentlyContinue | ForEach-Object FullName
          Write-Host "=== i386 lib dirs:"; $libDirs
          $libWin = $libDirs | Where-Object { $_ -match "libs_x86fre" -and $_ -match "\\lib\\win7\\" } | Select-Object -First 1
          if (-not $libWin) { $libWin = $libDirs | Where-Object { $_ -match "win7|wnet|wlh" } | Select-Object -First 1 }
          Write-Host "libWin choice: $libWin"; Get-ChildItem $libWin -Filter kernel32.lib | ForEach-Object FullName
          $libCrt = $libDirs | Where-Object { $_ -match "[Cc]rt" } | Select-Object -First 1
          if ($libWin) { Copy-Item -Recurse -Force $libWin C:\vc9\lib_win }
          if ($libCrt) { Copy-Item -Recurse -Force $libCrt C:\vc9\lib_crt }
          # ATL для WTL
          $incAtl = Get-ChildItem C:\wdkx -Recurse -Directory -Filter atl71 -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($incAtl) { Copy-Item -Recurse -Force $incAtl.FullName C:\vc9\inc_atl }
          $libAtl = Get-ChildItem C:\wdkx -Recurse -Directory -Filter atl -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "lib" } | Select-Object -First 1
          if ($libAtl) { Copy-Item -Recurse -Force $libAtl.FullName C:\vc9\lib_atl }
          # --- VC9 STL + sal.h из VS2008 Express ---
          $m2 = Mount-DiskImage -ImagePath C:\iso\VS2008Express.iso -PassThru
          $d2 = ($m2 | Get-Volume).DriveLetter
          New-Item -ItemType Directory -Force -Path C:\vcx | Out-Null
          & 7z x -y "-oC:\vcx\Ixpvc" "$d2`:\VCExpress\Ixpvc.exe" | Select-Object -Last 1
          & "C:\ProgramData\chocolatey\bin\lessmsi.exe" x "C:\vcx\Ixpvc\vs_setup.msi" "C:\vsx\" | Select-Object -Last 1
          $inc = Get-ChildItem C:\vsx -Recurse -Directory -Filter include | Where-Object { Test-Path (Join-Path $_.FullName "algorithm") } | Select-Object -First 1
          if (-not $inc) { throw "no VC include (algorithm) in Express extraction" }
          Copy-Item -Recurse -Force $inc.FullName C:\vc9\inc_stl
          $vclib = Get-ChildItem C:\vsx -Recurse -Directory -Filter lib | Where-Object { Test-Path (Join-Path $_.FullName "msvcrt.lib") } | Select-Object -First 1
          if ($vclib) { Copy-Item -Recurse -Force $vclib.FullName C:\vc9\lib_vc }
          Write-Host "=== staged:"; Get-ChildItem C:\vc9 | ForEach-Object Name; Get-ChildItem C:\vc9\bin | Select-Object -First 40 | ForEach-Object Name
          Dismount-DiskImage -ImagePath C:\iso\WDK71.iso
          Dismount-DiskImage -ImagePath C:\iso\VS2008Express.iso

      - name: Install jom + portable CMake 3.16
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.qt.io/official_releases/jom/jom.zip -OutFile jom.zip
          Expand-Archive jom.zip -DestinationPath C:\jom -Force
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v3.16.9/cmake-3.16.9-win64-x64.zip -OutFile cmake.zip
          Expand-Archive cmake.zip -DestinationPath C:\cmake316 -Force

      - name: Patch CMakeLists (drop files absent from published tree)
        shell: pwsh
        run: |
          $cml = "game/pw/branches/r1117/Src/CMakeLists.txt"
          $src = "game/pw/branches/r1117/Src"
          (Get-Content $cml) -replace [regex]::Escape('include_directories( ${SRC_DIR}/Server/NetworkAIO )'), "include_directories( `${SRC_DIR}/Server/NetworkAIO )`ninclude_directories( `${SRC_DIR}/Server/Chat )" | Set-Content $cml
          $lines = Get-Content $cml
          $out = foreach ($l in $lines) {
            if ($l -match 'set\( ALL_SRCS \$\{ALL_SRCS\} \$\{SRC_DIR\}(/[^ ]+) \)') {
              $rel = $Matches[1]
              $full = Join-Path $src $rel.TrimStart('/')
              if (-not (Test-Path $full)) { "# ABSENT: $l"; continue }
            }
            $l
          }
          # то же для vendor-либ: simple_add_library( [optimized|debug] ${VENDOR}/path )
          $vendor = "game/pw/branches/r1117/Vendor"
          $out2 = foreach ($l in $out) {
            if ($l -match 'simple_add_library\(\s*(optimized\s+|debug\s+)?\$\{VENDOR\}(/[^ )]+)\s*\)') {
              $rel = $Matches[2]
              $full = Join-Path $vendor ($rel.TrimStart('/') + ".lib")
              if (-not (Test-Path $full)) { "# ABSENTLIB: $l"; continue }
            }
            $l
          }
          Set-Content $cml $out2
          Select-String -Path $cml -Pattern "ABSENT" | ForEach-Object Line

      - name: Locate mt.exe from runner Windows Kits
        shell: pwsh
        run: |
          $mt = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter mt.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "\\x86\\" } | Select-Object -First 1
          if (-not $mt) { throw "no mt.exe on runner" }
          Write-Host "mt: $($mt.FullName)"
          "MT_DIR=$($mt.DirectoryName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Configure and build (Release)
        shell: cmd
        run: |
          set "PATH=C:\vc9\bin\x86;C:\vc9\bin;C:\jom;C:\cmake316\cmake-3.16.9-win64-x64\bin;%MT_DIR%;%PATH%"
          set "INCLUDE=C:\vc9\inc_stl;C:\vc9\inc_crt;C:\vc9\inc_api;C:\vc9\inc_atl"
          set "LIB=C:\vc9\lib_vc;C:\vc9\lib_crt;C:\vc9\lib_win;C:\vc9\lib_atl"
          cl 2>&1 | findstr /i version
          if errorlevel 1 echo cl probe nonzero (ok)
          mkdir build
          cd build
          where mt.exe rc.exe cvtres.exe 2>nul
          cmake -G "NMake Makefiles JOM" "%GITHUB_WORKSPACE%\game\pw\branches\r1117\Src" -DCMAKE_BUILD_TYPE=Release -DCMAKE_TRY_COMPILE_CONFIGURATION=Release "-DCMAKE_C_FLAGS_DEBUG=/Od" "-DCMAKE_CXX_FLAGS_DEBUG=/Od"
          if errorlevel 1 ( type CMakeFiles\CMakeError.log & exit /b 2 )
          jom /J 4

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrimeWorld-Release
          path: |
            build/PrimeWorld.exe
            build/*.dll
          if-no-files-found: warn
