name: build-client

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # nightly 02:30 UTC

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SRC_REPO: Prime-World-Classic/prime-world-classic
      R1117: pw/branches/r1117
    steps:
      - name: Checkout game sources (sparse, LFS)
        uses: actions/checkout@v4
        with:
          repository: Prime-World-Classic/prime-world-classic
          path: game
          lfs: true
          sparse-checkout: |
            pw/branches/r1117/Src
            pw/branches/r1117/Vendor
            pw/branches/r1117/Tools
          sparse-checkout-cone-mode: true

      - name: Cache VC9 toolchain
        id: vc9cache
        uses: actions/cache@v4
        with:
          path: C:\vc9
          key: vc9-sdk70-v2

      - name: Cache ISOs
        if: steps.vc9cache.outputs.cache-hit != 'true'
        id: isocache
        uses: actions/cache@v4
        with:
          path: C:\iso
          key: isos-v2

      - name: Download SDK ISO
        if: steps.vc9cache.outputs.cache-hit != 'true' && steps.isocache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\iso | Out-Null
          Invoke-WebRequest -Uri "https://archive.org/download/grmsdkx-en-dvd/GRMSDK_EN_DVD.iso" -OutFile C:\iso\GRMSDK_EN_DVD.iso -TimeoutSec 3000
          Invoke-WebRequest -Uri "https://archive.org/download/vs-2008-express-with-sp-1-esnx-1504732/VS2008ExpressWithSP1ESNx1504732.iso" -OutFile C:\iso\VS2008Express.iso -TimeoutSec 4000

      - name: Extract VC9 toolchain from ISOs (msiexec /a)
        if: steps.vc9cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # --- SDK 7.1: Windows headers/libs (совместимы с VS2008) ---
          $m1 = Mount-DiskImage -ImagePath C:\iso\GRMSDK_EN_DVD.iso -PassThru
          $d1 = ($m1 | Get-Volume).DriveLetter
          New-Item -ItemType Directory -Force -Path C:\sdkext | Out-Null
          foreach ($msi in @("Setup\WinSDKBuild\WinSDKBuild_x86.msi","Setup\WinSDK\WinSDK_x86.msi","Setup\WinSDKInterop\WinSDKInterop_x86.msi","Setup\WinSDKWin32Tools\WinSDKWin32Tools_x86.msi")) {
            $f = "$d1`:\$msi"
            if (Test-Path $f) { Write-Host ">>> $f"; Start-Process -Wait msiexec -ArgumentList "/a `"$f`" /qn TARGETDIR=C:\sdkext\$([IO.Path]::GetFileNameWithoutExtension($msi))" }
          }
          # --- VS2008 Express SP1: компилятор VC9 (payload в self-extract exe) ---
          $m2 = Mount-DiskImage -ImagePath C:\iso\VS2008Express.iso -PassThru
          $d2 = ($m2 | Get-Volume).DriveLetter
          Write-Host "=== VCExpress dir:"; Get-ChildItem "$d2`:\VCExpress" -Recurse -Depth 1 | Select-Object -First 40 | ForEach-Object FullName
          New-Item -ItemType Directory -Force -Path C:\vcx | Out-Null
          # вскрываем все exe из VCExpress (кроме WCU) семёркой
          Get-ChildItem "$d2`:\VCExpress" -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch "WCU" } |
            ForEach-Object {
              Write-Host ">>> 7z x $($_.FullName)"
              & 7z x -y "-oC:\vcx\$($_.BaseName)" $_.FullName | Select-Object -Last 2
            }
          Write-Host "=== extracted content:"; Get-ChildItem C:\vcx -Recurse -Depth 2 | Select-Object -First 60 | ForEach-Object FullName
          # msi внутри вскрытых exe -> админ-распаковка
          New-Item -ItemType Directory -Force -Path C:\vcext | Out-Null
          Get-ChildItem C:\vcx -Recurse -Filter *.msi -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host ">>> msiexec /a $($_.FullName)"
              Start-Process -Wait msiexec -ArgumentList "/a `"$($_.FullName)`" /qn TARGETDIR=C:\vcext\$($_.BaseName)"
            }
          Write-Host "=== Express cl.exe:"
          Get-ChildItem C:\vcext,C:\vcx -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | ForEach-Object FullName
          # --- staging ---
          $cl = Get-ChildItem C:\vcext,C:\vcx -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "amd64|x64|ia64" } | Select-Object -First 1
          if (-not $cl) { throw "no VC9 cl.exe extracted from Express — inspect listing" }
          New-Item -ItemType Directory -Force -Path C:\vc9 | Out-Null
          $vcroot = Split-Path (Split-Path $cl.FullName)
          Copy-Item -Recurse -Force $vcroot C:\vc9\VC
          $sdkinc = Get-ChildItem C:\sdkext -Recurse -Directory -Filter Include | Where-Object { Test-Path (Join-Path $_.FullName "Windows.h") } | Select-Object -First 1
          if (-not $sdkinc) { throw "no SDK Include with Windows.h" }
          Copy-Item -Recurse -Force (Split-Path $sdkinc.FullName) C:\vc9\SDK
          Write-Host "=== staged:"; Get-ChildItem C:\vc9\VC\bin\cl.exe; Get-ChildItem C:\vc9\SDK
          Dismount-DiskImage -ImagePath C:\iso\GRMSDK_EN_DVD.iso
          Dismount-DiskImage -ImagePath C:\iso\VS2008Express.iso

      - name: Install jom + portable CMake 3.16
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.qt.io/official_releases/jom/jom.zip -OutFile jom.zip
          Expand-Archive jom.zip -DestinationPath C:\jom -Force
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v3.16.9/cmake-3.16.9-win64-x64.zip -OutFile cmake.zip
          Expand-Archive cmake.zip -DestinationPath C:\cmake316 -Force

      - name: Configure and build (Release)
        shell: cmd
        run: |
          set "PATH=C:\vc9\VC\bin;C:\jom;C:\cmake316\cmake-3.16.9-win64-x64\bin;%PATH%"
          set "INCLUDE=C:\vc9\VC\include;C:\vc9\SDK\Include"
          set "LIB=C:\vc9\VC\lib;C:\vc9\SDK\Lib"
          cl 2>&1 | findstr /i version
          if errorlevel 1 echo cl probe nonzero (ok)
          mkdir build
          cd build
          cmake -G "NMake Makefiles JOM" "%GITHUB_WORKSPACE%\game\pw\branches\r1117\Src" -DCMAKE_BUILD_TYPE=Release
          jom /J 4

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrimeWorld-Release
          path: |
            build/PrimeWorld.exe
            build/*.dll
          if-no-files-found: warn
