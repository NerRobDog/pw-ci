name: build-client

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"   # nightly 02:30 UTC

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      SRC_REPO: Prime-World-Classic/prime-world-classic
      R1117: pw/branches/r1117
    steps:
      - name: Checkout game sources (sparse, LFS)
        uses: actions/checkout@v4
        with:
          repository: Prime-World-Classic/prime-world-classic
          path: game
          lfs: true
          sparse-checkout: |
            pw/branches/r1117/Src
            pw/branches/r1117/Vendor
            pw/branches/r1117/Tools
          sparse-checkout-cone-mode: true

      - name: Cache VC9 toolchain
        id: vc9cache
        uses: actions/cache@v4
        with:
          path: C:\vc9
          key: vc9-sdk70-v1

      - name: Cache SDK ISO
        if: steps.vc9cache.outputs.cache-hit != 'true'
        id: isocache
        uses: actions/cache@v4
        with:
          path: C:\iso\GRMSDK_EN_DVD.iso
          key: grmsdk-en-dvd-iso

      - name: Download SDK ISO
        if: steps.vc9cache.outputs.cache-hit != 'true' && steps.isocache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\iso | Out-Null
          Invoke-WebRequest -Uri "https://archive.org/download/grmsdkx-en-dvd/GRMSDK_EN_DVD.iso" -OutFile C:\iso\GRMSDK_EN_DVD.iso -TimeoutSec 3000

      - name: Extract VC9 toolchain from ISO (msiexec /a)
        if: steps.vc9cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $mount = Mount-DiskImage -ImagePath C:\iso\GRMSDK_EN_DVD.iso -PassThru
          $drive = ($mount | Get-Volume).DriveLetter
          Write-Host "=== ISO root:"; Get-ChildItem "$drive`:\" | ForEach-Object Name
          Write-Host "=== Setup dir:"; Get-ChildItem "$drive`:\Setup" -ErrorAction SilentlyContinue | ForEach-Object Name
          Write-Host "=== all MSI on ISO:"
          Get-ChildItem "$drive`:\" -Recurse -Filter *.msi -ErrorAction SilentlyContinue | ForEach-Object FullName
          # Admin-extract every msi that plausibly contains compilers/headers/libs
          New-Item -ItemType Directory -Force -Path C:\vc9ext | Out-Null
          Get-ChildItem "$drive`:\" -Recurse -Include vc_stdx86.msi,winsdk_intellidocs.msi,*.msi -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "vc_std|WinSDKBuild|WinSDKInterop|WinSDK_|WinSDKWin32Tools|winsdk" } |
            ForEach-Object {
              $n = $_.BaseName
              Write-Host ">>> extracting $($_.FullName)"
              Start-Process -Wait msiexec -ArgumentList "/a `"$($_.FullName)`" /qn TARGETDIR=C:\vc9ext\$n"
            }
          Write-Host "=== extracted cl.exe candidates:"
          Get-ChildItem C:\vc9ext -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | ForEach-Object FullName
          Write-Host "=== extracted include dirs:"
          Get-ChildItem C:\vc9ext -Recurse -Directory -Filter Include -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object FullName
          # Stage: find x86 cl.exe, take its VC root; find SDK include/lib
          $cl = Get-ChildItem C:\vc9ext -Recurse -Filter cl.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "amd64|x64|ia64" } | Select-Object -First 1
          if (-not $cl) { throw "no cl.exe extracted — inspect listing above" }
          New-Item -ItemType Directory -Force -Path C:\vc9 | Out-Null
          # VC root = two levels up from bin\cl.exe
          $vcroot = Split-Path (Split-Path $cl.FullName)
          Copy-Item -Recurse -Force $vcroot C:\vc9\VC
          $sdkinc = Get-ChildItem C:\vc9ext -Recurse -Directory -Filter Include | Where-Object { Test-Path (Join-Path $_.FullName "Windows.h") } | Select-Object -First 1
          if ($sdkinc) {
            $sdkroot = Split-Path $sdkinc.FullName
            Copy-Item -Recurse -Force $sdkroot C:\vc9\SDK
          }
          Get-ChildItem C:\vc9 -Depth 2 | Select-Object -First 40 | ForEach-Object FullName
          Dismount-DiskImage -ImagePath C:\iso\GRMSDK_EN_DVD.iso

      - name: Install jom + portable CMake 3.16
        shell: pwsh
        run: |
          Invoke-WebRequest https://download.qt.io/official_releases/jom/jom.zip -OutFile jom.zip
          Expand-Archive jom.zip -DestinationPath C:\jom -Force
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v3.16.9/cmake-3.16.9-win64-x64.zip -OutFile cmake.zip
          Expand-Archive cmake.zip -DestinationPath C:\cmake316 -Force

      - name: Configure and build (Release)
        shell: cmd
        run: |
          set "PATH=C:\vc9\VC\bin;C:\jom;C:\cmake316\cmake-3.16.9-win64-x64\bin;%PATH%"
          set "INCLUDE=C:\vc9\VC\include;C:\vc9\SDK\Include"
          set "LIB=C:\vc9\VC\lib;C:\vc9\SDK\Lib"
          cl 2>&1 | findstr /i version
          if errorlevel 1 echo cl probe nonzero (ok)
          mkdir build
          cd build
          cmake -G "NMake Makefiles JOM" "%GITHUB_WORKSPACE%\game\pw\branches\r1117\Src" -DCMAKE_BUILD_TYPE=Release
          jom /J 4

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PrimeWorld-Release
          path: |
            build/PrimeWorld.exe
            build/*.dll
          if-no-files-found: warn
